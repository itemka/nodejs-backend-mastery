name: interview-lab

services:
  api:
    profiles: [api]
    build:
      context: ../../..
      dockerfile: workspaces/apps/interview-lab/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    init: true
    stop_grace_period: 15s

  postgres:
    profiles: [data]
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: [data]
    image: redis:7.4-bookworm
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
